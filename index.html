<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site - Versão 3 — corrigida</title>
  <style>
    :root {
      --verde: #168a4d;
      --verde-escuro: #0d6337;
      --fundo: #e8f7ef;
      --texto: #173126;
      --texto-suave: #53665c;
      --borda: #cfe4d8;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--texto);
      background: linear-gradient(135deg, #c8a2c8, #e6c6e8);
    }

    .cartao {
      background: #fff;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 1.25rem;
      padding: clamp(1.5rem, 5vw, 2.75rem);
      max-width: 520px;
      width: 100%;
      box-shadow: 0 1.25rem 3rem rgba(4, 45, 24, .24);
      text-align: center;
    }

    .emoji { font-size: 4rem; line-height: 1; }
    h1 { margin: .75rem 0 .5rem; color: var(--verde-escuro); font-size: clamp(1.7rem, 6vw, 2.25rem); }
    p { margin: 0; color: var(--texto-suave); line-height: 1.6; }

    .versao {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--borda);
      border-radius: .75rem;
      background: var(--fundo);
      text-align: left;
      line-height: 1.9;
    }

    code {
      padding: .15rem .4rem;
      border-radius: .35rem;
      background: #d8eee0;
      color: var(--verde-escuro);
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--borda);
      color: var(--texto-suave);
      font-size: .85rem;
      line-height: 1.6;
    }

    @media (max-width: 420px) {
      body { padding: .75rem; }
      .versao { font-size: .95rem; }
    }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="emoji" role="img" aria-label="Coração">❤️</div>
    <h1>Deus é bom e o diabo não presta!</h1>
    <p>E viva a Taylor Swift.</p>

    <div class="versao">
      🤖 <strong>Publicado pelo robô em:</strong> __DATA__<br>
      🔖 <strong>Commit:</strong> <code>__COMMIT__</code><br>
      👤 <strong>Enviado por:</strong> __AUTOR__
    </div>

    <footer>
      🎓 UNINOVE · Automação de Processos · DevOps<br>
      Prof. Marcelino Dias da Silva
    </footer>
  </main>
</body>
</html>
